<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BRRRARRGH's Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js"></script>
</head>

<body>
    <div class="sidebar">
        <input class="tab-control" type="radio" name="tabs" id="home-tab" checked>
        <input class="tab-control" type="radio" name="tabs" id="genres-tab">
        <input class="tab-control" type="radio" name="tabs" id="games-tab">
        <input class="tab-control" type="radio" name="tabs" id="consoles-tab">

        <nav class="tab-nav" aria-label="Main navigation">
        <label for="home-tab" class="tab-link">Home</label>
        <label for="genres-tab" class="tab-link">Genres</label>
        <label for="games-tab" class="tab-link">Games</label>
        <label for="consoles-tab" class="tab-link">Consoles</label>
        </nav>
    </div>
  <main>


    <section class="tab-panel home-panel" id="home" aria-labelledby="home-tab">
    </section>

    <section class="tab-panel" id="genres" aria-labelledby="genres-tab">
    </section>

    <section class="tab-panel games-panel" id="games" aria-labelledby="games-tab">
    </section>

    <section class="tab-panel" id="consoles" aria-labelledby="consoles-tab">
    </section>
  </main>

  <footer class="footer">
  </footer>
</body>

</html>
